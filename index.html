<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse — Modern Publishing Platform</title>
  <meta name="description" content="A modern, responsive blogging and longform reading platform built with HTML, CSS, and Vanilla JavaScript with persistent browser storage." />

  <!-- Google Fonts: Inter & Plus Jakarta Sans for premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/feed.css" />
  <link rel="stylesheet" href="css/article.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/profile.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Top Navigation Header -->
  <header class="app-header" id="app-header">
    <div class="nav-container">
      
      <!-- Brand Logo -->
      <a href="#feed" class="nav-brand">
        <span class="brand-logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </span>
        <span class="brand-name">Pulse<span class="brand-dot">.</span></span>
      </a>

      <!-- Quick Global Search in Header -->
      <form class="nav-search-form" id="nav-search-form" role="search">
        <span class="nav-search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input 
          type="text" 
          id="nav-search-input" 
          class="nav-search-input" 
          placeholder="Search stories, topics, authors..." 
          autocomplete="off" 
        />
      </form>

      <!-- Desktop Nav Links -->
      <nav class="nav-links-desktop">
        <a href="#feed" class="nav-link active">
          <span>Discover</span>
        </a>
        <a href="#bookmarks" class="nav-link nav-bookmarks-link">
          <span>Reading List</span>
          <span class="nav-counter-pill" id="nav-bookmarks-count">0</span>
        </a>
        <a href="#write" class="btn btn-primary btn-sm nav-write-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon-sm">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          <span>Write</span>
        </a>
      </nav>

      <!-- Action Controls (Theme, User Dropdown, Mobile menu) -->
      <div class="nav-actions">
        <!-- Theme Toggle -->
        <button type="button" class="icon-btn theme-toggle-btn" id="theme-toggle-btn" title="Toggle color mode" aria-label="Toggle color mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <!-- User Profile Dropdown Menu -->
        <div class="user-menu-wrapper">
          <button type="button" class="user-avatar-btn" id="user-menu-btn" aria-label="Open profile menu" aria-haspopup="true">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Current User" id="nav-user-avatar" class="nav-avatar" />
          </button>
          
          <div class="user-dropdown-menu hidden" id="user-dropdown">
            <a href="#profile" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              <span>Your Profile</span>
            </a>
            <a href="#write" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              <span>Write Story</span>
            </a>
            <a href="#bookmarks" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              <span>Reading List</span>
            </a>
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item" id="dropdown-backup-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>Backup & Restore</span>
            </button>
            <button type="button" class="dropdown-item text-danger" id="dropdown-reset-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
              <span>Reset Demo Data</span>
            </button>
          </div>
        </div>

        <!-- Mobile Menu Toggle Button -->
        <button type="button" class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Open mobile menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

    </div>

    <!-- Mobile Navigation Drawer -->
    <div class="mobile-nav-drawer" id="mobile-nav-drawer">
      <div class="mobile-nav-content">
        <a href="#feed" class="mobile-nav-link">
          <span>Discover Stories</span>
        </a>
        <a href="#bookmarks" class="mobile-nav-link">
          <span>Reading List</span>
        </a>
        <a href="#write" class="mobile-nav-link">
          <span>Write a Story</span>
        </a>
        <a href="#profile" class="mobile-nav-link">
          <span>My Profile</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Application Views Wrapper -->
  <div class="app-viewport">
    <div id="view-feed" class="view-section"></div>
    <div id="view-article" class="view-section hidden"></div>
    <div id="view-editor" class="view-section hidden"></div>
    <div id="view-bookmarks" class="view-section hidden"></div>
    <div id="view-profile" class="view-section hidden"></div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
